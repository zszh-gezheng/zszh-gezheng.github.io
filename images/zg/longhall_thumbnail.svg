<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">HalTrapper research loop</title><desc id="desc">Directory schematic. Context modification experiments systematically shift hallucination positions. Contextual coherence is hypothesized to create tension between consistency and novelty. Contextual completeness is hypothesized to drive compensatory imagination based on context. These ideas inform Internal Grounding and External Expansion, followed by targeted suppression. A probability glyph indicates targeted reduction of hallucination candidates. A subdued return path represents method-based revalidation of the contextual hypotheses. Similar attention maps and repeated hallucinations across prompts illustrate observations supporting the contextual hypotheses. Repetition primarily supports context-dependent extrapolation, not the compensatory-occurrence mechanism by itself. All curves, attention maps and probability bars are conceptual illustrations, not measured results. The two branches indicate primary design relationships, not exclusive dependence on a single hypothesis.</desc><defs><style>text{font-family:'Times New Roman',Times,serif}</style>
